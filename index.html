<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .pending-count {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            background: #445cb8;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }

        .todo-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .todo-text {
            flex: 1;
            color: #333;
            font-size: 16px;
            word-wrap: break-word;
            transition: all 0.2s;
        }

        .todo-text.completed {
            text-decoration: line-through;
            opacity: 0.6;
            color: #999;
        }

        .todo-delete {
            background: #dc3545;
            padding: 8px 12px;
            font-size: 14px;
            flex-shrink: 0;
        }

        .todo-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minhas Tarefas</h1>
        <div class="pending-count"><span id="pending-count">0</span> tarefas pendentes</div>

        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Adicionar nova tarefa...">
            <button id="add-btn">Adicionar</button>
        </div>

        <ul class="todo-list" id="todo-list"></ul>
        <div class="empty-state" id="empty-state">Nenhuma tarefa ainda. Adicione uma para começar!</div>
    </div>

    <script>
        const todoInput = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');
        const emptyState = document.getElementById('empty-state');
        const pendingCountEl = document.getElementById('pending-count');

        const STORAGE_KEY = 'todoList';
        let todos = [];
        let nextId = 1;

        function saveTodos() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        }

        function loadTodos() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    todos = JSON.parse(stored);
                    if (Array.isArray(todos) && todos.length > 0) {
                        nextId = Math.max(...todos.map(t => t.id || 0)) + 1;
                    }
                } else {
                    todos = [];
                }
            } catch (e) {
                todos = [];
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) return;

            const todo = { id: nextId++, text, completed: false };
            todos.push(todo);
            saveTodos();
            todoInput.value = '';
            todoInput.focus();
            render();
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                render();
            }
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            saveTodos();
            render();
        }

        function updatePendingCount() {
            const pending = todos.filter(t => !t.completed).length;
            pendingCountEl.textContent = pending;
        }

        function render() {
            todoList.innerHTML = '';

            if (todos.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                todos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = 'todo-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = todo.completed;
                    checkbox.addEventListener('change', () => toggleTodo(todo.id));

                    const span = document.createElement('span');
                    span.className = `todo-text ${todo.completed ? 'completed' : ''}`;
                    span.textContent = todo.text;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'todo-delete';
                    deleteBtn.textContent = 'Deletar';
                    deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

                    li.appendChild(checkbox);
                    li.appendChild(span);
                    li.appendChild(deleteBtn);
                    todoList.appendChild(li);
                });
            }

            updatePendingCount();
        }

        addBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        loadTodos();
        render();
    </script>
</body>
</html>
