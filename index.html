<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 500px;
      padding: 30px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 4px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.3s;
    }

    button:hover {
      background: #5568d3;
    }

    .list-container {
      margin-top: 20px;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 40px 20px;
      font-size: 14px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 4px;
      margin-bottom: 10px;
      border-left: 4px solid #667eea;
      transition: background 0.2s;
    }

    .item:hover {
      background: #f0f0f0;
    }

    .item-content {
      flex: 1;
      color: #333;
      word-break: break-word;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      margin-left: 12px;
    }

    .remove-btn {
      padding: 6px 12px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .remove-btn:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Minhas Tarefas</h1>

    <div class="input-group">
      <input
        type="text"
        id="taskInput"
        placeholder="Adicione uma nova tarefa..."
        autocomplete="off"
      >
      <button id="addBtn">Adicionar</button>
    </div>

    <div class="list-container" id="listContainer"></div>
  </div>

  <script>
    const STORAGE_KEY = 'todoList';

    const state = {
      tasks: []
    };

    function loadFromStorage() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          state.tasks = JSON.parse(stored);
        } catch (e) {
          state.tasks = [];
          console.error('Erro ao carregar tasks do localStorage', e);
        }
      }
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
    }

    function generateId() {
      return Date.now() + Math.random().toString(36).substr(2, 9);
    }

    function addTask(text) {
      if (!text.trim()) return;

      const task = {
        id: generateId(),
        text: text.trim(),
        createdAt: new Date().toISOString()
      };

      state.tasks.push(task);
      saveToStorage();
      render();
    }

    function removeTask(id) {
      const initialLength = state.tasks.length;
      state.tasks = state.tasks.filter(task => task.id !== id);

      if (state.tasks.length !== initialLength) {
        saveToStorage();
      }

      render();
    }

    function render() {
      const container = document.getElementById('listContainer');

      if (state.tasks.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhuma tarefa. Adicione uma para começar!</div>';
        return;
      }

      container.innerHTML = state.tasks.map(task => `
        <div class="item">
          <div class="item-content">${escapeHtml(task.text)}</div>
          <div class="item-actions">
            <button class="remove-btn" onclick="removeTask('${task.id}')">Remover</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function handleAddClick() {
      const input = document.getElementById('taskInput');
      addTask(input.value);
      input.value = '';
      input.focus();
    }

    // Event listeners
    document.getElementById('addBtn').addEventListener('click', handleAddClick);
    document.getElementById('taskInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleAddClick();
      }
    });

    // Initialize
    loadFromStorage();
    render();
  </script>
</body>
</html>
