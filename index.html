<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        #itemInput {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        #itemInput:focus {
            outline: none;
            border-color: #4CAF50;
        }

        #addBtn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        #addBtn:hover {
            background-color: #45a049;
        }

        #addBtn:active {
            background-color: #3d8b40;
        }

        #todoList {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
        }

        .todo-item:hover {
            background-color: #f9f9f9;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #4CAF50;
        }

        .todo-text {
            flex: 1;
            font-size: 14px;
            color: #333;
            transition: all 0.2s;
        }

        .todo-item input[type="checkbox"]:checked ~ .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minha Lista</h1>
        <div class="input-group">
            <input type="text" id="itemInput" placeholder="Adicione uma tarefa..." />
            <button id="addBtn">Adicionar</button>
        </div>
        <ul id="todoList"></ul>
        <div id="emptyState" class="empty-state">Nenhuma tarefa adicionada</div>
    </div>

    <script>
        const STORAGE_KEY = 'todoList';
        let todoList = [];
        let nextId = 1;

        // Elementos do DOM
        const todoListEl = document.getElementById('todoList');
        const itemInputEl = document.getElementById('itemInput');
        const addBtnEl = document.getElementById('addBtn');
        const emptyStateEl = document.getElementById('emptyState');

        // Carrega dados do localStorage
        function loadFromStorage() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                todoList = JSON.parse(stored);
                if (todoList.length > 0) {
                    nextId = Math.max(...todoList.map(item => item.id)) + 1;
                }
            }
        }

        // Salva dados no localStorage
        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(todoList));
        }

        // Renderiza a lista
        function render() {
            todoListEl.innerHTML = '';

            if (todoList.length === 0) {
                emptyStateEl.style.display = 'block';
            } else {
                emptyStateEl.style.display = 'none';
                todoList.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'todo-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = item.concluido;
                    checkbox.addEventListener('change', () => toggleItem(item.id));

                    const span = document.createElement('span');
                    span.className = 'todo-text';
                    span.textContent = item.texto;

                    li.appendChild(checkbox);
                    li.appendChild(span);
                    todoListEl.appendChild(li);
                });
            }
        }

        // Alterna o estado do item
        function toggleItem(id) {
            const item = todoList.find(i => i.id === id);
            if (item) {
                item.concluido = !item.concluido;
                saveToStorage();
                render();
            }
        }

        // Adiciona novo item
        function addItem() {
            const texto = itemInputEl.value.trim();
            if (texto === '') return;

            todoList.push({
                id: nextId,
                texto: texto,
                concluido: false
            });

            nextId++;
            saveToStorage();
            itemInputEl.value = '';
            render();
        }

        // Event listeners
        addBtnEl.addEventListener('click', addItem);
        itemInputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });

        // Inicializa
        loadFromStorage();
        render();
    </script>
</body>
</html>
