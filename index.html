<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #taskInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #addBtn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        #addBtn:hover {
            background: #5568d3;
        }

        #addBtn:active {
            transform: scale(0.98);
        }

        #taskList {
            list-style: none;
            margin-bottom: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 4px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        .task-item:hover {
            background: #f0f0f0;
        }

        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-text {
            flex: 1;
            color: #333;
            font-size: 16px;
            word-break: break-word;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: #ee5a52;
        }

        .delete-btn:active {
            transform: scale(0.95);
        }

        .pending-info {
            text-align: center;
            font-size: 16px;
            color: #666;
            font-weight: 500;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Minhas Tarefas</h1>

        <div class="input-group">
            <input
                type="text"
                id="taskInput"
                placeholder="Digite uma nova tarefa..."
                autocomplete="off"
            >
            <button id="addBtn">Adicionar</button>
        </div>

        <ul id="taskList"></ul>

        <div id="emptyMessage" class="empty-message"></div>

        <div class="pending-info" id="pendingInfo">0 tarefa(s) pendente(s)</div>
    </div>

    <script>
        const STORAGE_KEY = 'todoList';
        let tasks = [];
        let useStorage = isStorageAvailable();

        function isStorageAvailable() {
            try {
                const test = '__localStorage_test__';
                localStorage.setItem(test, test);
                localStorage.removeItem(test);
                return true;
            } catch (e) {
                return false;
            }
        }

        function loadTasks() {
            if (useStorage) {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    tasks = data ? JSON.parse(data) : [];
                } catch (e) {
                    tasks = [];
                }
            } else {
                tasks = [];
            }
        }

        function saveTasks() {
            if (useStorage) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                } catch (e) {
                    // localStorage indisponível, continua em memória
                }
            }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function addTask(text) {
            const trimmed = text.trim();
            if (!trimmed) return;

            const task = {
                id: generateId(),
                text: trimmed,
                completed: false
            };

            tasks.push(task);
            saveTasks();
            render();
            document.getElementById('taskInput').value = '';
            document.getElementById('taskInput').focus();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                render();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
        }

        function countPending() {
            return tasks.filter(t => !t.completed).length;
        }

        function render() {
            const listEl = document.getElementById('taskList');
            const emptyEl = document.getElementById('emptyMessage');
            const pendingEl = document.getElementById('pendingInfo');

            listEl.innerHTML = '';

            if (tasks.length === 0) {
                emptyEl.textContent = 'Nenhuma tarefa ainda. Adicione uma!';
                pendingEl.textContent = '0 tarefa(s) pendente(s)';
                return;
            }

            emptyEl.textContent = '';

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.completed;
                checkbox.addEventListener('change', () => toggleTask(task.id));

                const span = document.createElement('span');
                span.className = 'task-text';
                if (task.completed) {
                    span.classList.add('completed');
                }
                span.textContent = task.text;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Remover';
                deleteBtn.addEventListener('click', () => deleteTask(task.id));

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteBtn);
                listEl.appendChild(li);
            });

            const pending = countPending();
            pendingEl.textContent = `${pending} tarefa(s) pendente(s)`;
        }

        // Event listeners
        document.getElementById('addBtn').addEventListener('click', () => {
            addTask(document.getElementById('taskInput').value);
        });

        document.getElementById('taskInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask(e.target.value);
            }
        });

        // Inicializar
        loadTasks();
        render();
    </script>
</body>
</html>
