<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>

    <form id="add-form" autocomplete="off">
      <input type="text" id="new-item-text" placeholder="Novo item..." required />

    </form>

    <ul id="item-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
