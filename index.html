<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .counter {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            min-height: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:hover {
            background: #f9f9f9;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-text {
            flex: 1;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            word-break: break-word;
        }

        .task-text.completed {
            color: #999;
            text-decoration: line-through;
        }

        .task-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .task-delete:hover {
            background: #ee5a52;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minhas Tarefas</h1>
        <div class="counter" id="counter">Nenhuma tarefa pendente</div>

        <div class="input-group">
            <input
                type="text"
                id="taskInput"
                placeholder="Adicione uma nova tarefa..."
                aria-label="Texto da nova tarefa"
            >
            <button id="addBtn">Adicionar</button>
        </div>

        <ul class="task-list" id="taskList"></ul>
    </div>

    <script>
        const STORAGE_KEY = 'todoItems';
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const counter = document.getElementById('counter');

        let tasks = [];

        function loadTasks() {
            const stored = localStorage.getItem(STORAGE_KEY);
            try {
                tasks = stored ? JSON.parse(stored) : [];
            } catch (e) {
                tasks = [];
            }
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function updateCounter() {
            const pending = tasks.filter(t => !t.completed).length;
            if (pending === 0) {
                counter.textContent = 'Nenhuma tarefa pendente';
            } else if (pending === 1) {
                counter.textContent = '1 tarefa pendente';
            } else {
                counter.textContent = `${pending} tarefas pendentes`;
            }
        }

        function renderTasks() {
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">Nenhuma tarefa adicionada</div>';
                updateCounter();
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'task-checkbox';
                checkbox.checked = task.completed;
                checkbox.addEventListener('change', () => toggleTask(task.id));

                const span = document.createElement('span');
                span.className = 'task-text';
                if (task.completed) span.classList.add('completed');
                span.textContent = task.text;
                span.addEventListener('click', () => toggleTask(task.id));

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'task-delete';
                deleteBtn.textContent = 'Remover';
                deleteBtn.addEventListener('click', () => deleteTask(task.id));

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            });

            updateCounter();
        }

        function addTask(text) {
            const trimmed = text.trim();
            if (trimmed === '') return;

            const task = {
                id: Date.now(),
                text: trimmed,
                completed: false
            };

            tasks.push(task);
            saveTasks();
            renderTasks();
            taskInput.value = '';
            taskInput.focus();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        addBtn.addEventListener('click', () => addTask(taskInput.value));

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask(taskInput.value);
            }
        });

        loadTasks();
        renderTasks();
    </script>
</body>
</html>
